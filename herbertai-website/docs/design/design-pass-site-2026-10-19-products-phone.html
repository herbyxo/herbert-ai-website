<h1>Products: the phone layout</h1><p class="intro">Detail 6 of 6, the last for this section. The whole band at 375, each option beside today. Checked at 320 as well.</p><div class="row"><figure><figcaption><b>Today</b><span>The ads-only phone version: cost per enquiry, a Meta campaign card, a daily audit feed. It no longer matches the laptop dashboard or the story.</span></figcaption><img src="assets-2026-10-19/products-phone-today.png"></figure><figure><figcaption><b>1. The full product on the phone</b><span>The same phone, rebuilt to match the laptop: spend across every channel, jobs booked, cost per job; the Creative’s new ad and landing page waiting on you; a booked lead landing at the top. The story, then the owner running it from their phone. Recommended.</span></figcaption><img src="assets-2026-10-19/products-phone-1.png"></figure><figure><figcaption><b>2. No phone version</b><span>The story carries the band on its own: about half the height, nothing to show the product working.</span></figcaption><img src="assets-2026-10-19/products-phone-2.png"></figure><figure><figcaption><b>3. Phone first</b><span>The phone version straight under the line, the story after it as the caption. Shows the product first, but the story lands after a long scroll.</span></figcaption><img src="assets-2026-10-19/products-phone-3.png"></figure></div></body>
